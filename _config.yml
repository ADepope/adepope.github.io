title: "Al Depope"
author: "Al Depope"
tagline: "Postdoctoral Researcher at ISTA — Bayesian inference, statistical genetics and scalable machine learning."
description: "Al Depope — Postdoctoral Researcher at the Institute of Science and Technology Austria (ISTA), working on Bayesian inference, approximate message passing and high-performance statistical genetics."
url: "https://adepope.github.io"
email: "al.depope@ist.ac.at"
orcid: "0000-0001-8583-0609"
permalink: /:title/
lang: "en"
excerpt_separator: "\n\n\n"
date_format: "%B %d, %Y"

# Hero portrait. Swap in a new photo with:
#   python3 tools/update-photo.py <file> --out images/portrait.jpg --focus 0.5,0.35
portrait: "/images/portrait.jpg"

# CV. The PDF is compiled from the .tex by tools/build-cv.sh; set cv_pdf to ""
# to hide the download button on the CV page.
cv_pdf: "/assets/cv/Al_Depope_CV.pdf"

# Layout

show_excerpts: false        # show article excerpts on the home page
show_frame: false           # adds a gray frame to the site
show_sidebar: false         # show a sidebar instead of the usual header
minimal: true               # use a dark header

# Menu

navigation:                # accepts {file, title, url, icon, sidebaricon}
  - {file: "index.md", title: "About"}
  - {file: "research.html", title: "Research"}
  - {file: "publications.html", title: "Publications"}
  - {file: "software.html", title: "Software"}
  - {file: "gvamp_tutorial.md", title: "gVAMP tutorial"}
  - {file: "cv.html", title: "CV"}

external:                  # shows a footer with social links - for available icons see fontawesome.com/icons
  - {title: Mail, icon: envelope, url: "mailto:al.depope@ist.ac.at"}
  - {title: Github, icon: github, url: "https://github.com/ADepope"}
  - {title: LinkedIn, icon: linkedin, url: "https://www.linkedin.com/in/al-depope/"}
  - {title: ORCID, icon: orcid, url: "https://orcid.org/0000-0001-8583-0609"}

# Extra Font Awesome icons to bake into /assets/fontawesome/icons.svg so they can
# be used inline anywhere via <svg class="icon"><use xlink:href="...#name"></use></svg>
extra_icons:
  - file-pdf
  - file-alt
  - external-link-alt
  - arrow-right
  - download
  - award
  - graduation-cap
  - briefcase
  - university
  - map-marker-alt
  - chalkboard-teacher
  - laptop-code
  - project-diagram
  - microscope
  - dna
  - brain
  - database
  - server
  - users
  - language
  - hiking
  - book

comments:
#  disqus_shortname: ""    # see https://disqus.com/
#  isso_domain: ""         # see https://posativ.org/isso/

collections:
  publications:
    output: true
    permalink: /:collection/:name

kramdown:
  math_engine: mathjax   # emits \(..\) / \[..\]; KaTeX renders it client-side

plugins:
 - jekyll-feed
